    <script>
/* Renderizado.
 *
 * Dos vistas del mismo estado: el formulario (editor) y la hoja (imprimible).
 * Las dos se generan recorriendo el esquema del deporte, así que nunca se
 * desincronizan y añadir un deporte no requiere tocar este archivo.
 *
 * Los campos equivalentes de ambas vistas comparten data-path, que es lo que
 * permite reflejar un cambio de un panel en el otro sin volver a dibujar nada.
 */

(function (PL) {
    'use strict';

    var h = PL.h;

    // Ancho de cada columna en el formulario y peso relativo en la hoja.
    var TRACK = { xs: '62px', sm: '92px', md: 'minmax(130px, 1fr)', lg: 'minmax(190px, 2fr)' };
    var WEIGHT = { xs: 1, sm: 1.6, md: 2.4, lg: 4 };

    var ORG_FALLBACK = 'Formatos oficiales para competencias';

    function track(col) { return TRACK[col.size] || TRACK.md; }
    function weight(col) { return WEIGHT[col.size] || WEIGHT.md; }

    function rosterTitle(block) {
        return block.team ? 'Plantilla · ' : block.title;
    }

    function teamNameSpan(team, data) {
        return h('span', { dataset: { teamName: team }, text: PL.teamName(data, team) });
    }

    function formatMeta(field, value) {
        if (field.type === 'date' && value) {
            var parts = value.split('-');
            if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
        }
        return value || '';
    }

    function shortDate(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
    }

    // ------------------------------------------------------- barra de planillas

    function renderSheetBar(sport, sheets, activeId) {
        var select = h('select', { class: 'input', dataset: { action: 'sheet-select' }, 'aria-label': 'Planilla guardada' },
            sheets.map(function (s) {
                return h('option', {
                    value: s.id,
                    selected: s.id === activeId,
                    text: s.name + ' · ' + shortDate(s.updatedAt)
                });
            }));

        var active = sheets.filter(function (s) { return s.id === activeId; })[0] || sheets[0];

        return PL.frag([
            h('span', { class: 'sheetbar-label', text: 'Planilla' }),
            select,
            h('input', {
                class: 'input',
                value: active.name,
                placeholder: 'Nombre',
                'aria-label': 'Nombre de la planilla',
                dataset: { action: 'sheet-rename' }
            }),
            h('div', { class: 'sheetbar-actions' }, [
                h('button', { class: 'btn small', type: 'button', text: '+ Nueva', dataset: { action: 'sheet-new' } }),
                h('button', { class: 'btn small', type: 'button', text: 'Ejemplo', title: 'Carga una planilla de muestra con datos inventados', dataset: { action: 'sheet-demo' } }),
                h('button', { class: 'btn small', type: 'button', text: 'Duplicar', dataset: { action: 'sheet-dup' } }),
                h('button', { class: 'btn small', type: 'button', text: 'Borrar', dataset: { action: 'sheet-del' } })
            ])
        ]);
    }

    // ---------------------------------------------------------------- formulario

    function fieldControl(field, value, path) {
        var id = 'f-' + path.replace(/\./g, '-');

        var control = field.type === 'select'
            ? h('select', { class: 'input', id: id, dataset: { path: path } },
                field.options.map(function (option) {
                    return h('option', { value: option, text: option, selected: option === value });
                }))
            : h('input', {
                class: 'input',
                id: id,
                type: field.type || 'text',
                placeholder: field.placeholder || '',
                value: value || '',
                dataset: { path: path }
            });

        return h('div', { class: 'field' }, [
            h('label', { for: id, text: field.label }),
            control
        ]);
    }

    /** Datos de la institución: se comparten entre todos los deportes. */
    function configForm(config) {
        return h('details', { class: 'block config' }, [
            h('summary', { text: 'Institución y logo' }),
            h('div', { class: 'field-grid' }, [
                h('div', { class: 'field' }, [
                    h('label', { for: 'f-institucion', text: 'Nombre de la institución' }),
                    h('input', {
                        class: 'input',
                        id: 'f-institucion',
                        value: config.institucion || '',
                        placeholder: 'Ej: I.E. José Carlos Mariátegui',
                        dataset: { config: 'institucion' }
                    })
                ]),
                h('div', { class: 'field' }, [
                    h('label', { text: 'Logo' }),
                    h('div', { class: 'logo-row' }, [
                        config.logo ? h('img', { class: 'logo-preview', src: config.logo, alt: 'Logo' }) : null,
                        h('button', { class: 'btn small', type: 'button', text: 'Elegir imagen', dataset: { action: 'logo-pick' } }),
                        config.logo ? h('button', { class: 'btn small ghost', type: 'button', text: 'Quitar', dataset: { action: 'logo-clear' } }) : null
                    ])
                ])
            ])
        ]);
    }

    function metaForm(sport, data) {
        return h('section', { class: 'block' }, [
            h('header', { class: 'block-head' }, [h('h3', { text: 'Datos generales' })]),
            h('div', { class: 'field-grid' }, sport.meta.map(function (field) {
                return fieldControl(field, data.meta[field.key], 'meta.' + field.key);
            }))
        ]);
    }

    function rosterForm(block, data) {
        var rows = data.rosters[block.key];
        var columns = block.columns.filter(function (col) { return !col.sheetOnly; });
        var hidden = block.columns.length - columns.length;

        var grid = h('div', {
            class: 'grid-table',
            style: { gridTemplateColumns: '30px ' + columns.map(track).join(' ') + ' 30px' }
        });

        grid.appendChild(h('div', { class: 'gt-head', text: 'N°' }));
        columns.forEach(function (col) { grid.appendChild(h('div', { class: 'gt-head', text: col.label })); });
        grid.appendChild(h('div', { class: 'gt-head' }));

        PL.layoutRows(block, rows.length).forEach(function (item) {
            if (item.group) {
                grid.appendChild(h('div', { class: 'gt-group', text: item.group }));
                return;
            }

            var i = item.index;
            grid.appendChild(h('div', { class: 'gt-num', text: String(i + 1) }));

            columns.forEach(function (col) {
                grid.appendChild(h('input', {
                    class: col.computed ? 'input computed' : 'input',
                    type: col.type || 'text',
                    value: rows[i][col.key] || '',
                    readOnly: !!col.computed,
                    tabIndex: col.computed ? -1 : null,
                    title: col.computed ? 'Se calcula solo' : null,
                    'aria-label': col.label + ', fila ' + (i + 1),
                    dataset: col.computed
                        ? { path: 'rosters.' + block.key + '.' + i + '.' + col.key, computed: '1' }
                        : { path: 'rosters.' + block.key + '.' + i + '.' + col.key }
                }));
            });

            grid.appendChild(h('button', {
                class: 'row-remove',
                type: 'button',
                text: '×',
                title: 'Quitar la fila (si es de las mínimas, sólo se vacía)',
                'aria-label': 'Quitar fila ' + (i + 1),
                dataset: { action: 'row-remove', block: block.key, index: String(i) }
            }));
        });

        var hint = block.hint || (hidden > 0 ? hidden + ' columnas más se rellenan en la planilla' : rows.length + ' filas');

        return h('section', { class: 'block' }, [
            h('header', { class: 'block-head' }, [
                h('h3', {}, [rosterTitle(block), block.team ? teamNameSpan(block.team, data) : null]),
                h('span', { class: 'hint', text: hint })
            ]),
            h('div', { class: 'scroll-x' }, [grid]),
            h('div', { class: 'block-foot' }, [
                h('button', {
                    class: 'btn small',
                    type: 'button',
                    text: '+ ' + (block.addLabel || 'Añadir fila'),
                    dataset: { action: 'row-add', block: block.key }
                }),
                h('button', {
                    class: 'btn small ghost',
                    type: 'button',
                    text: 'Plantilla CSV',
                    title: 'Descarga esta tabla en blanco para rellenarla en Excel y volver a importarla',
                    dataset: { action: 'roster-template', block: block.key }
                })
            ])
        ]);
    }

    function periodsForm(block, data) {
        var totalLabel = block.totalMode === 'wins' ? block.unit + 's' : 'Total';

        var header = h('div', { class: 'periods-row' }, [
            h('span', {}),
            h('div', { class: 'periods-inputs' }, block.labels.map(function (label) {
                return h('span', { class: 'gt-head', style: { width: '52px', textAlign: 'center' }, text: label });
            })),
            h('span', { class: 'gt-head', text: totalLabel })
        ]);

        var rows = ['local', 'visitante'].map(function (team) {
            return h('div', { class: 'periods-row' }, [
                h('span', { class: 'team-name' }, [teamNameSpan(team, data)]),
                h('div', { class: 'periods-inputs' }, block.labels.map(function (label, i) {
                    return h('input', {
                        class: 'input',
                        type: 'number',
                        min: '0',
                        value: data.periods[block.key][team][i] || '',
                        'aria-label': block.unit + ' ' + label + ', ' + team,
                        dataset: { path: 'periods.' + block.key + '.' + team + '.' + i }
                    });
                })),
                h('span', { class: 'periods-total', dataset: { score: block.key + '.' + team }, text: '0' })
            ]);
        });

        return h('section', { class: 'block' }, [
            h('header', { class: 'block-head' }, [
                h('h3', { text: block.title }),
                h('span', {
                    class: 'hint',
                    text: block.totalMode === 'wins' ? 'El marcador cuenta sets ganados' : 'El total se calcula solo'
                })
            ]),
            h('div', { class: 'periods-grid' }, [header].concat(rows))
        ]);
    }

    function notesForm(block, data) {
        return h('section', { class: 'block' }, [
            h('header', { class: 'block-head' }, [h('h3', { text: block.label })]),
            h('textarea', {
                class: 'input',
                rows: 4,
                placeholder: block.placeholder || '',
                value: data.notes[block.key] || '',
                'aria-label': block.label,
                dataset: { path: 'notes.' + block.key }
            })
        ]);
    }

    function renderForm(sport, data, config) {
        var sections = [configForm(config), metaForm(sport, data)];

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') sections.push(rosterForm(block, data));
            else if (block.type === 'periods') sections.push(periodsForm(block, data));
            else if (block.type === 'notes') sections.push(notesForm(block, data));
        });

        return PL.frag(sections);
    }

    // -------------------------------------------------------------- revisión

    /** Sólo cuentan como problemas los errores y avisos: lo pendiente es neutro. */
    function renderReview(issues) {
        var problems = issues.filter(function (item) { return item.level !== 'info'; });
        var shown = issues.slice(0, 12);

        return PL.frag([
            h('h3', {
                class: 'review-title',
                text: problems.length ? 'Revisión (' + problems.length + ')' : 'Revisión'
            }),
            problems.length ? null : h('div', { class: 'review-ok', text: 'Sin problemas.' }),
            shown.length
                ? h('ul', { class: 'review-list' }, shown.map(function (item) {
                    return h('li', { class: item.level, text: item.text });
                }))
                : null,
            issues.length > shown.length
                ? h('div', { class: 'hint', text: 'y ' + (issues.length - shown.length) + ' más' })
                : null
        ]);
    }

    // ------------------------------------------------------------------- hoja

    function sheetHead(sport, data, config) {
        var chips = sport.meta
            .filter(function (field) { return !(sport.teams && (field.key === 'local' || field.key === 'visitante')); })
            .map(function (field) {
                return h('div', {}, [
                    h('span', { class: 'label', text: field.label + ': ' }),
                    h('span', { class: 'value', dataset: { metaValue: field.key }, text: formatMeta(field, data.meta[field.key]) })
                ]);
            });

        return [
            h('header', { class: 'sheet-head' }, [
                config.logo ? h('img', { class: 'sheet-logo', src: config.logo, alt: '' }) : null,
                h('div', { class: 'sheet-headings' }, [
                    h('div', { class: 'sheet-org', dataset: { configValue: 'institucion' }, text: config.institucion || ORG_FALLBACK }),
                    h('div', { class: 'sheet-title', text: sport.title }),
                    h('div', { class: 'sheet-subtitle', dataset: { sheetSubtitle: sport.subtitleFrom }, text: data.meta[sport.subtitleFrom] || '' })
                ])
            ]),
            h('div', { class: 'sheet-meta' }, chips)
        ];
    }

    function scoreboard(sport, data) {
        var block = PL.blocksOfType(sport, 'periods')[0];
        if (!block) return null;

        return h('div', { class: 'scoreboard' }, [
            h('div', { class: 'side' }, [h('small', { text: 'Local' }), teamNameSpan('local', data)]),
            h('div', { class: 'result' }, [
                h('span', { dataset: { score: block.key + '.local' }, text: '0' }),
                ' – ',
                h('span', { dataset: { score: block.key + '.visitante' }, text: '0' })
            ]),
            h('div', { class: 'side away' }, [h('small', { text: 'Visitante' }), teamNameSpan('visitante', data)])
        ]);
    }

    function blockClass(block) {
        return block.breakBefore ? 'sheet-block break-before' : 'sheet-block';
    }

    function periodsSheet(block, data) {
        var head = h('tr', {}, [h('th', { text: block.unit })]
            .concat(block.labels.map(function (label) { return h('th', { text: label }); }))
            .concat([h('th', { text: 'Total' })]));

        var rows = ['local', 'visitante'].map(function (team) {
            var cells = [h('td', { class: 'team' }, [teamNameSpan(team, data)])];

            block.labels.forEach(function (label, i) {
                cells.push(h('td', {}, [h('input', {
                    type: 'number',
                    value: data.periods[block.key][team][i] || '',
                    'aria-label': block.unit + ' ' + label + ', ' + team,
                    dataset: { path: 'periods.' + block.key + '.' + team + '.' + i }
                })]));
            });

            cells.push(h('td', { class: 'total', dataset: { total: block.key + '.' + team }, text: '0' }));
            return h('tr', {}, cells);
        });

        return h('section', { class: blockClass(block) }, [
            h('h3', { text: block.title }),
            h('table', { class: 'planilla' }, [h('thead', {}, [head]), h('tbody', {}, rows)])
        ]);
    }

    function rosterSheet(block, data) {
        var rows = data.rosters[block.key];
        var columns = block.columns;
        var span = columns.length + (block.numbered ? 1 : 0);

        var weights = (block.numbered ? [0.7] : []).concat(columns.map(weight));
        var total = weights.reduce(function (a, b) { return a + b; }, 0);
        var cols = h('colgroup', {}, weights.map(function (w) {
            return h('col', { style: { width: (w / total * 100).toFixed(2) + '%' } });
        }));

        var head = h('tr', {}, (block.numbered ? [h('th', { text: 'N°' })] : [])
            .concat(columns.map(function (col) { return h('th', { text: col.label }); })));

        var body = [];
        PL.layoutRows(block, rows.length).forEach(function (item) {
            if (item.group) {
                body.push(h('tr', { class: 'group' }, [h('td', { colspan: span, text: item.group })]));
                return;
            }

            var i = item.index;
            var cells = block.numbered ? [h('td', { class: 'num', text: String(i + 1) })] : [];

            columns.forEach(function (col) {
                var classes = [];
                if (col.align === 'left') classes.push('left');
                if (col.computed) classes.push('computed');

                cells.push(h('td', {}, [h('input', {
                    class: classes.length ? classes.join(' ') : null,
                    type: col.type === 'number' ? 'number' : 'text',
                    value: rows[i][col.key] || '',
                    readOnly: !!col.computed,
                    tabIndex: col.computed ? -1 : null,
                    'aria-label': col.label + ', fila ' + (i + 1),
                    dataset: col.computed
                        ? { path: 'rosters.' + block.key + '.' + i + '.' + col.key, computed: '1' }
                        : { path: 'rosters.' + block.key + '.' + i + '.' + col.key }
                })]));
            });

            body.push(h('tr', {}, cells));
        });

        return h('section', { class: blockClass(block) }, [
            h('h3', {}, [rosterTitle(block), block.team ? teamNameSpan(block.team, data) : null]),
            h('table', { class: 'planilla' }, [cols, h('thead', {}, [head]), h('tbody', {}, body)])
        ]);
    }

    function notesSheet(block, data) {
        return h('section', { class: blockClass(block) }, [
            h('h3', { text: block.label }),
            h('textarea', {
                value: data.notes[block.key] || '',
                'aria-label': block.label,
                dataset: { path: 'notes.' + block.key }
            })
        ]);
    }

    function signatures(sport) {
        if (!sport.signatures || !sport.signatures.length) return null;
        return h('footer', { class: 'signatures' }, sport.signatures.map(function (role) {
            return h('div', { class: 'signature', text: role });
        }));
    }

    function renderSheet(sport, data, config) {
        var parts = sheetHead(sport, data, config);

        parts.push(scoreboard(sport, data));

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') parts.push(rosterSheet(block, data));
            else if (block.type === 'periods') parts.push(periodsSheet(block, data));
            else if (block.type === 'notes') parts.push(notesSheet(block, data));
        });

        parts.push(signatures(sport));
        return PL.frag(parts);
    }

    PL.renderForm = renderForm;
    PL.renderSheet = renderSheet;
    PL.renderSheetBar = renderSheetBar;
    PL.renderReview = renderReview;
    PL.formatMeta = formatMeta;
    PL.ORG_FALLBACK = ORG_FALLBACK;
})(window.PL);
    </script>
    <script>
/* Arranque y conexión de las piezas.
 *
 * Cinco escuchadores delegados (input, change, click, paste, keydown) en vez
 * de los onclick repartidos por el HTML. Escribir no vuelve a dibujar nada: se actualiza el
 * estado, se recalculan los valores derivados y se refleja el valor en el
 * campo gemelo del otro panel, así no se pierde el foco ni el cursor.
 */

(function (PL) {
    'use strict';

    var $ = PL.$;
    var $$ = PL.$$;
    var h = PL.h;
    var Store = PL.Store;

    var workspace, editor, formHost, review, sheetbar, sheet, tabs;
    var sport;

    function blockByKey(key) {
        for (var i = 0; i < sport.blocks.length; i++) {
            if (sport.blocks[i].key === key) return sport.blocks[i];
        }
        return null;
    }

    /** "rosters.plantillaLocal.3.dorsal" -> { block, row, col } */
    function parseRosterPath(path) {
        var parts = path.split('.');
        if (parts[0] !== 'rosters') return null;
        return { block: parts[1], row: Number(parts[2]), col: parts[3] };
    }

    function cellPath(blockKey, row, colKey) {
        return 'rosters.' + blockKey + '.' + row + '.' + colKey;
    }

    /** El formulario oculta las columnas sheetOnly; la hoja las muestra todas. */
    function panelColumns(block, el) {
        if (el.closest('#sheet')) return block.columns;
        return block.columns.filter(function (col) { return !col.sheetOnly; });
    }

    function focusCell(blockKey, row, colKey, scope) {
        var el = $('[data-path="' + cellPath(blockKey, row, colKey) + '"]', scope);
        if (el) {
            el.focus();
            if (el.select) el.select();
        }
        return el;
    }

    function setText(selector, text) {
        $$(selector, workspace).forEach(function (el) { el.textContent = text; });
    }

    // ------------------------------------------------------------- derivados

    /** Recalcula columnas, marcadores y avisos, y los vuelca en el DOM ya pintado. */
    function updateDerived() {
        var data = Store.data(sport.id);

        PL.recompute(sport, data);

        $$('[data-computed]', workspace).forEach(function (el) {
            var value = String(Store.get(sport.id, el.dataset.path));
            if (el.value !== value) el.value = value;
        });

        PL.blocksOfType(sport, 'periods').forEach(function (block) {
            var result = PL.periodScore(block, data);
            ['local', 'visitante'].forEach(function (team) {
                setText('[data-total="' + block.key + '.' + team + '"]', String(result.sum[team]));
                setText('[data-score="' + block.key + '.' + team + '"]', String(result.score[team]));
            });
        });

        PL.replace(review, PL.renderReview(PL.validate(sport, data)));
    }

    function updateDocTitle() {
        var subtitle = (Store.data(sport.id).meta[sport.subtitleFrom] || '').trim();
        document.title = sport.title + (subtitle ? ' · ' + subtitle : '') + ' — Planillas';
    }

    function render() {
        var data = Store.data(sport.id);
        var config = Store.getConfig();
        var scroll = sheet.parentNode.scrollTop;

        PL.replace(sheetbar, PL.renderSheetBar(sport, Store.sheets(sport.id), Store.sheet(sport.id).id));
        PL.replace(formHost, PL.renderForm(sport, data, config));
        PL.replace(sheet, PL.renderSheet(sport, data, config));

        sheet.parentNode.scrollTop = scroll;
        updateDerived();
        updateDocTitle();
    }

    function selectSport(id) {
        sport = PL.sportById(id);
        Store.setActive(sport.id);

        $$('.tab', tabs).forEach(function (tab) {
            tab.setAttribute('aria-selected', String(tab.dataset.sport === sport.id));
        });

        render();
        editor.scrollTop = 0;
    }

    /** Un cambio en los datos generales sólo afecta a textos sueltos de la hoja. */
    function onMetaChange(key) {
        var data = Store.data(sport.id);

        if (key === 'local' || key === 'visitante') {
            setText('[data-team-name="' + key + '"]', PL.teamName(data, key));
        }

        var subtitle = $('[data-sheet-subtitle="' + key + '"]', workspace);
        if (subtitle) subtitle.textContent = data.meta[key] || '';

        var chip = $('[data-meta-value="' + key + '"]', workspace);
        if (chip) {
            var field = sport.meta.filter(function (f) { return f.key === key; })[0];
            chip.textContent = PL.formatMeta(field, data.meta[key]);
        }

        if (key === sport.subtitleFrom) updateDocTitle();
    }

    // --------------------------------------------------------------- eventos

    function onInput(event) {
        var el = event.target;
        if (!el.dataset) return;

        if (el.dataset.action === 'sheet-rename') {
            Store.renameSheet(sport.id, el.value);
            var current = Store.sheet(sport.id).id;
            $$('option', sheetbar).forEach(function (option) {
                if (option.value === current) option.textContent = el.value;
            });
            return;
        }

        if (el.dataset.config) {
            Store.setConfig(el.dataset.config, el.value);
            setText('[data-config-value="' + el.dataset.config + '"]', el.value || PL.ORG_FALLBACK);
            return;
        }

        var path = el.dataset.path;
        if (!path) return;

        Store.set(sport.id, path, el.value);

        // Reflejar el valor en el campo equivalente del otro panel.
        $$('[data-path="' + path + '"]', workspace).forEach(function (twin) {
            if (twin !== el && twin.value !== el.value) twin.value = el.value;
        });

        if (path.indexOf('meta.') === 0) onMetaChange(path.split('.')[1]);
        updateDerived();
    }

    /**
     * Pegar desde Excel. El portapapeles llega como TSV, así que un bloque de
     * celdas se reparte por filas y columnas desde donde está el cursor,
     * creando las filas que hagan falta. Pegar un valor suelto (sin tabuladores
     * ni saltos de línea) se deja al navegador.
     */
    function onPaste(event) {
        var el = event.target;
        if (!el.dataset || !el.dataset.path) return;

        var pos = parseRosterPath(el.dataset.path);
        if (!pos) return;

        var text = event.clipboardData ? event.clipboardData.getData('text/plain') : '';
        if (!text || !/[\t\r\n]/.test(text)) return;

        event.preventDefault();

        var block = blockByKey(pos.block);
        var columns = panelColumns(block, el);
        var start = 0;
        for (var i = 0; i < columns.length; i++) {
            if (columns[i].key === pos.col) { start = i; break; }
        }

        var grid = text.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(function (line) {
            return line.split('\t');
        });

        var rows = Store.data(sport.id).rosters[block.key];
        grid.forEach(function (cells, r) {
            var row = pos.row + r;
            while (rows.length <= row) Store.addRow(sport.id, block);

            cells.forEach(function (value, c) {
                var column = columns[start + c];
                if (!column || column.computed) return;
                Store.set(sport.id, cellPath(block.key, row, column.key), value.trim());
            });
        });

        render();
        focusCell(block.key, pos.row, columns[start].key, el.closest('#sheet') ? sheet : editor);
    }

    /** Enter y flechas recorren la columna, como en una hoja de cálculo. */
    function onKeyDown(event) {
        var el = event.target;
        if (!el.dataset || !el.dataset.path) return;

        var pos = parseRosterPath(el.dataset.path);
        if (!pos) return;

        var step = 0;
        if (event.key === 'Enter' || event.key === 'ArrowDown') step = 1;
        else if (event.key === 'ArrowUp') step = -1;
        else return;

        event.preventDefault();

        var block = blockByKey(pos.block);
        var target = pos.row + step;
        if (target < 0) return;

        var scope = el.closest('#sheet') ? sheet : editor;

        if (target >= Store.data(sport.id).rosters[block.key].length) {
            Store.addRow(sport.id, block);
            render();
        }

        focusCell(block.key, target, pos.col, scope);
    }

    function onChange(event) {
        var el = event.target;
        if (el.dataset && el.dataset.action === 'sheet-select') {
            Store.selectSheet(sport.id, el.value);
            render();
        }
    }

    // ------------------------------------------------------- importar/exportar

    function currentFilename(extension) {
        return 'planilla-' + sport.id + '-' + PL.io.slug(Store.sheet(sport.id).name) + '.' + extension;
    }

    function exportJSON() {
        PL.io.download(currentFilename('json'), 'application/json', PL.io.toJSON(sport, Store.sheet(sport.id)));
    }

    function exportCSV() {
        PL.io.download(currentFilename('csv'), 'text/csv', PL.io.toCSV(sport, Store.sheet(sport.id), Store.getConfig()));
    }

    function importPlanilla(text) {
        var imported = PL.io.fromJSON(text);
        Store.importSheet(imported.sportId, imported.name, imported.data);
        selectSport(imported.sportId);
    }

    /** Una plantilla CSV trae una sola tabla: reemplaza esa, no la planilla entera. */
    function importRoster(text) {
        var parsed = PL.io.fromCSV(text);
        if (parsed.sportId !== sport.id) selectSport(parsed.sportId);

        if (!window.confirm('Se reemplazarán las filas de "' + parsed.blockTitle +
            '" en la planilla actual por ' + parsed.rows.length + ' fila(s) del archivo. ¿Continuar?')) return;

        Store.setRosterRows(sport.id, blockByKey(parsed.rosterKey), parsed.rows);
        render();
    }

    function importFile() {
        PL.io.pickFile('.json,.csv,application/json,text/csv').then(function (file) {
            if (!file) return;
            return PL.io.readText(file).then(function (text) {
                if (/\.csv$/i.test(file.name || '')) importRoster(text);
                else importPlanilla(text);
            });
        }).catch(function (error) {
            window.alert('No se pudo importar: ' + error.message);
        });
    }

    function pickLogo() {
        PL.io.pickFile('image/*').then(function (file) {
            if (!file) return;
            return PL.io.readImage(file, 240).then(function (dataUrl) {
                Store.setConfig('logo', dataUrl);
                render();
            });
        }).catch(function (error) {
            window.alert('No se pudo cargar el logo: ' + error.message);
        });
    }

    /** Los errores (un dorsal repetido) frenan; los avisos sólo informan. */
    function printSheet() {
        var errors = PL.validate(sport, Store.data(sport.id)).filter(function (i) { return i.level === 'error'; });

        if (errors.length && !window.confirm(
            'La planilla tiene ' + errors.length + ' error(es):\n\n' +
            errors.slice(0, 5).map(function (i) { return '· ' + i.text; }).join('\n') +
            '\n\n¿Imprimir de todas formas?')) return;

        window.print();
    }

    function onClick(event) {
        var el = event.target.closest ? event.target.closest('[data-action]') : null;
        if (!el) return;

        var action = el.dataset.action;

        if (action === 'print') {
            printSheet();
        } else if (action === 'tab') {
            selectSport(el.dataset.sport);
        } else if (action === 'export-json') {
            exportJSON();
        } else if (action === 'export-csv') {
            exportCSV();
        } else if (action === 'import') {
            importFile();
        } else if (action === 'roster-template') {
            var tabla = blockByKey(el.dataset.block);
            PL.io.download('plantilla-' + sport.id + '-' + PL.io.slug(tabla.title) + '.csv', 'text/csv',
                PL.io.toTemplateCSV(sport, tabla, Store.data(sport.id)));
        } else if (action === 'logo-pick') {
            pickLogo();
        } else if (action === 'logo-clear') {
            Store.setConfig('logo', '');
            render();
        } else if (action === 'sheet-new') {
            Store.createSheet(sport.id);
            render();
        } else if (action === 'sheet-demo') {
            var muestra = PL.demoData(sport.id);
            if (muestra) {
                Store.importSheet(sport.id, 'Ejemplo', muestra);
                render();
            }
        } else if (action === 'sheet-dup') {
            Store.duplicateSheet(sport.id);
            render();
        } else if (action === 'sheet-del') {
            if (window.confirm('¿Borrar la planilla "' + Store.sheet(sport.id).name + '"?')) {
                Store.removeSheet(sport.id);
                render();
            }
        } else if (action === 'row-add') {
            var block = blockByKey(el.dataset.block);
            var index = Store.addRow(sport.id, block);
            render();
            var first = $('[data-path="rosters.' + block.key + '.' + index + '.' + block.columns[0].key + '"]', editor);
            if (first) first.focus();
        } else if (action === 'row-remove') {
            Store.removeRow(sport.id, blockByKey(el.dataset.block), Number(el.dataset.index));
            render();
        }
    }

    function buildTabs() {
        PL.replace(tabs, PL.sports.map(function (s) {
            return h('button', {
                class: 'tab',
                type: 'button',
                role: 'tab',
                text: s.label,
                'aria-selected': 'false',
                dataset: { action: 'tab', sport: s.id }
            });
        }));
    }

    function init() {
        workspace = $('#workspace');
        editor = $('#editor');
        formHost = $('#form-host');
        review = $('#review');
        sheetbar = $('#sheetbar');
        sheet = $('#sheet');
        tabs = $('#tabs');

        Store.load();
        buildTabs();
        selectSport(Store.getActive());

        document.addEventListener('input', onInput);
        document.addEventListener('change', onChange);
        document.addEventListener('click', onClick);
        document.addEventListener('paste', onPaste);
        document.addEventListener('keydown', onKeyDown);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})(window.PL);
    </script>
</body>
