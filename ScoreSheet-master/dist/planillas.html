    <style>
/* Tokens, reset y tipografía. Nada específico de la aplicación. */

:root {
    color-scheme: dark;

    --bg: #0b1015;
    --panel: #121a22;
    --panel-2: #161f28;
    --field: #0d141a;

    --line: #24313d;
    --line-soft: #1a232c;
    /* Borde de un control interactivo: debe distinguirse del fondo (3:1). */
    --control-line: #566a7a;

    --text: #e7eef4;
    --muted: #93a5b5;
    --accent: #4cc2ff;
    --accent-ink: #05202e;
    --danger: #f06a62;
    --warn: #e6b867;

    --radius: 10px;
    --radius-sm: 6px;

    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;

    /* Ancho útil de una A4 vertical con márgenes de 12mm. */
    --sheet-width: 186mm;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

body,
h1,
h2,
h3,
p,
figure {
    margin: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(1100px 520px at 12% -12%, #17242f 0%, transparent 62%),
        var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

h1 {
    font-size: 1.15rem;
    letter-spacing: 0.01em;
}

h2 {
    font-size: 0.95rem;
}

h3 {
    font-size: 0.85rem;
}

button {
    font: inherit;
}

input,
select,
textarea {
    font: inherit;
    color: inherit;
}

/* Oculta los spinners de los campos numéricos: en una planilla estorban. */
input[type="number"] {
    -moz-appearance: textfield;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

/* --- Integración con el sistema --- */

:root {
    /* Controles nativos (calendario, números) en el tono de la aplicación. */
    accent-color: var(--accent);
    scrollbar-color: #2b3945 transparent;
}

::selection {
    background: rgba(76, 194, 255, 0.30);
    color: #fff;
}
    </style>
    <style>
/* Cromo de la aplicación: cabecera, pestañas de deporte y editor.
   Todo esto desaparece al imprimir (ver sheet.css). */

.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(19, 28, 37, 0.96), rgba(15, 22, 29, 0.96));
    border-bottom: 1px solid var(--line);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand p {
    color: var(--muted);
    font-size: 0.78rem;
}

.app-actions {
    display: flex;
    gap: 8px;
}

/* --- Botones --- */

.btn {
    padding: 0.5rem 0.95rem;
    border: 1px solid var(--control-line);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
}

.btn:hover {
    background: #1e2831;
    border-color: #7d93a3;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
}

.btn.primary:hover {
    background: #6ccdff;
    border-color: #6ccdff;
}

.btn.ghost {
    background: transparent;
}

.btn.small {
    padding: 0.35rem 0.7rem;
    font-size: 0.76rem;
}

/* --- Pestañas de deporte --- */

.sport-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: thin;
}

.tab {
    flex: 0 0 auto;
    padding: 0.5rem 0.95rem;
    border: 1px solid var(--control-line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.15s, background-color 0.15s, border-color 0.15s;
}

.tab:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.07);
}

.tab[aria-selected="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
}

/* --- Espacio de trabajo: editor a la izquierda, hoja a la derecha --- */

.workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 20px;
    padding: 0 20px 24px;
    align-items: start;
}

.editor,
.sheet-wrap {
    max-height: calc(100vh - 150px);
    overflow: auto;
    scrollbar-width: thin;
}

.editor {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
}

.sheet-wrap {
    display: flex;
    /* flex-start y no el stretch por defecto: con stretch la hoja adopta la
       altura del contenedor y todo lo que sobra se pinta fuera del papel. */
    align-items: flex-start;
    justify-content: center;
    padding: 4px;
}

@media (max-width: 1080px) {
    .workspace {
        grid-template-columns: minmax(0, 1fr);
    }

    .editor,
    .sheet-wrap {
        max-height: none;
        overflow: visible;
    }
}

/* --- Bloques del formulario --- */

.block + .block {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
}

.block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.block-head h3 {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-size: 0.72rem;
}

.hint {
    color: var(--muted);
    font-size: 0.74rem;
}

/* --- Campos --- */

.field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.field > label {
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.input {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--control-line);
    border-radius: var(--radius-sm);
    background: var(--field);
    font-size: 0.85rem;
    transition: border-color 0.15s;
}

.input::placeholder {
    color: #748695;
}

.input:hover:not(:focus) {
    border-color: #7d93a3;
}

.input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(76, 194, 255, 0.15);
    outline: none;
}

textarea.input {
    resize: vertical;
    min-height: 90px;
}

/* --- Tabla editable (plantillas y listas de competidores) --- */

.scroll-x {
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 4px;
}

.grid-table {
    display: grid;
    gap: 4px;
    align-items: center;
    min-width: max-content;
}

.gt-head {
    padding: 0 2px 4px;
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
}

.gt-num {
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
}

.gt-group {
    grid-column: 1 / -1;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.grid-table .input {
    padding: 0.35rem 0.45rem;
    font-size: 0.8rem;
}

.row-remove {
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--control-line);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
}

.row-remove:hover {
    border-color: var(--danger);
    color: var(--danger);
}

.block-foot {
    margin-top: 10px;
}

/* --- Marcador por periodos dentro del formulario --- */

.periods-grid {
    display: grid;
    gap: 8px;
}

.periods-row {
    display: grid;
    grid-template-columns: minmax(90px, 150px) 1fr auto;
    align-items: center;
    gap: 10px;
}

.periods-row .team-name {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.periods-inputs {
    display: flex;
    gap: 6px;
}

.periods-inputs .input {
    width: 52px;
    padding: 0.35rem 0.2rem;
    text-align: center;
}

.periods-total {
    min-width: 44px;
    padding: 0.3rem 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    font-weight: 700;
    text-align: center;
}

/* --- Barra de planillas guardadas --- */

.sheetbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
}

.sheetbar-label {
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.sheetbar select.input {
    flex: 1 1 150px;
    max-width: 230px;
}

.sheetbar input.input {
    flex: 1 1 130px;
}

.sheetbar-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
}

/* --- Institución (plegable) --- */

details.config summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

details.config[open] summary {
    margin-bottom: 12px;
}

.logo-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

.logo-preview {
    width: 38px;
    height: 38px;
    padding: 2px;
    border-radius: 4px;
    background: #fff;
    object-fit: contain;
}

/* --- Campos calculados: se ven, no se tocan --- */

.input.computed {
    background: rgba(76, 194, 255, 0.07);
    border-color: rgba(76, 194, 255, 0.25);
    color: var(--accent);
    cursor: default;
}

/* --- Revisión --- */

.review {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
}

.review-title {
    margin-bottom: 8px;
    color: var(--accent);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.review-ok {
    color: var(--muted);
    font-size: 0.78rem;
}

.review-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 0;
    padding-left: 18px;
}

.review-list li {
    font-size: 0.78rem;
}

/* Lo que falta por rellenar es una nota, no una alarma: gris y sin viñeta. */
.review-list li.info {
    margin-left: -18px;
    color: var(--muted);
    list-style: none;
}

.review-list li.warn {
    color: var(--warn);
}

.review-list li.error {
    color: var(--danger);
}
    </style>
    <style>
/* La planilla: papel blanco en pantalla, A4 real al imprimir.
   Los recuadros de la cuadrícula los dibujan las celdas, no los inputs,
   para que lo escrito se lea como texto y lo vacío quede listo para rellenar a mano. */

.sheet {
    width: 100%;
    max-width: var(--sheet-width);
    padding: 12mm;
    background: #fff;
    color: #101418;
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 14px 38px rgba(0, 0, 0, 0.5);
    font-size: 11.5px;
    line-height: 1.4;
}

.sheet-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 2px solid #101418;
    text-align: center;
}

.sheet-headings {
    flex: 1;
    min-width: 0;
}

.sheet-logo {
    flex: none;
    width: 46px;
    height: 46px;
    object-fit: contain;
}

/* Contrapeso del logo para que el título siga centrado en la hoja. */
.sheet-head:has(.sheet-logo)::after {
    content: "";
    flex: none;
    width: 46px;
}

.sheet-org {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #4a5560;
}

.sheet-title {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.sheet-subtitle {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: #333c45;
}

.sheet-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 22px;
    margin-bottom: 12px;
    font-size: 10.5px;
}

.sheet-meta .label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.sheet-meta .value {
    border-bottom: 1px solid #101418;
    min-width: 70px;
    display: inline-block;
    padding: 0 4px;
}

/* --- Marcador --- */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding: 8px 10px;
    border: 1.5px solid #101418;
}

.scoreboard .side {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
}

.scoreboard .side.away {
    text-align: right;
}

.scoreboard .side small {
    display: block;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #5a646e;
}

.scoreboard .result {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    white-space: nowrap;
}

/* --- Bloques y tablas --- */

.sheet-block {
    margin-bottom: 12px;
    break-inside: auto;
}

.sheet-block h3 {
    margin-bottom: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #333c45;
}

table.planilla {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

table.planilla th,
table.planilla td {
    border: 1px solid #101418;
    padding: 0;
    text-align: center;
    vertical-align: middle;
}

table.planilla th {
    padding: 4px 3px;
    background: #e9edf1;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    word-break: break-word;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

table.planilla td.num,
table.planilla td.team {
    padding: 3px;
    font-size: 10px;
    font-weight: 600;
}

table.planilla td.team {
    text-align: left;
    text-transform: uppercase;
}

table.planilla td.total {
    background: #f1f4f7;
    font-size: 12px;
    font-weight: 700;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

table.planilla tr.group td {
    padding: 3px 5px;
    background: #e9edf1;
    font-size: 9px;
    font-weight: 700;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

/* Campos dentro de la hoja: sin borde propio, la celda ya lo aporta. */
.sheet input,
.sheet textarea {
    width: 100%;
    padding: 3px 4px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: center;
}

.sheet input:focus,
.sheet textarea:focus {
    outline: 0;
    background: #fff6cc;
}

.sheet input.left {
    text-align: left;
}

.sheet textarea {
    min-height: 70px;
    border: 1px solid #101418;
    text-align: left;
    resize: vertical;
}

/* --- Firmas --- */

.signatures {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 14px;
    margin-top: 26px;
    break-inside: avoid;
}

.signature {
    flex: 1 1 130px;
    padding-top: 5px;
    border-top: 1px solid #101418;
    font-size: 9px;
    font-weight: 600;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* --- Impresión: sólo la planilla --- */

@media print {
    @page {
        size: A4 portrait;
        margin: 12mm;
    }

    html,
    body {
        background: #fff;
    }

    .no-print {
        display: none !important;
    }

    .workspace {
        display: block;
        padding: 0;
        gap: 0;
    }

    .sheet-wrap {
        display: block;
        max-height: none;
        overflow: visible;
        padding: 0;
    }

    .sheet {
        max-width: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        font-size: 10px;
    }

    /* Repite la cabecera de la tabla en cada página de una lista larga. */
    table.planilla thead {
        display: table-header-group;
    }

    table.planilla tr {
        break-inside: avoid;
    }

    .sheet input:focus,
    .sheet textarea:focus {
        background: transparent;
    }
}

/* --- Campos calculados y saltos de página --- */

.sheet input.computed {
    background: #f1f5f9;
    font-weight: 600;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

.sheet-block.break-before {
    margin-top: 18px;
}

@media print {
    .sheet-block.break-before {
        margin-top: 0;
        break-before: page;
        page-break-before: always;
    }
}

/* Sobre el papel blanco el texto seleccionado debe seguir leyéndose en negro. */
.sheet ::selection {
    background: rgba(76, 194, 255, 0.35);
    color: #101418;
}
    </style>

    <!-- Archivo único generado con "npm run build". Código fuente modular en app/. -->
    <!-- El HTML es sólo el armazón: las pestañas, el formulario y la planilla
         se generan desde el esquema de js/schema.js. -->

    <header class="app-header no-print">
        <div class="brand">
            <div>
                <h1>Planillas Deportivas</h1>
                <p>Rellena, revisa e imprime la planilla oficial</p>
            </div>
        </div>
        <div class="app-actions">
            <button type="button" class="btn ghost" data-action="import">Importar</button>
            <button type="button" class="btn ghost" data-action="export-json">JSON</button>
            <button type="button" class="btn ghost" data-action="export-csv">CSV</button>
            <button type="button" class="btn primary" data-action="print">Imprimir</button>
        </div>
    </header>

    <nav class="sport-tabs no-print" id="tabs" role="tablist" aria-label="Deportes"></nav>

    <main class="workspace" id="workspace">
        <section class="editor no-print" id="editor" aria-label="Formulario de datos">
            <div class="sheetbar" id="sheetbar"></div>
            <div id="form-host"></div>
            <div class="review" id="review"></div>
        </section>
        <section class="sheet-wrap" id="sheet-wrap">
            <article class="sheet" id="sheet" aria-label="Planilla"></article>
        </section>
    </main>

    <noscript>
        <p style="padding: 20px;">Esta aplicación necesita JavaScript activado.</p>
    </noscript>

    <script>
/* Utilidades mínimas de DOM.

    <script>
/* Valores derivados y revisión de la planilla.
 *
 * Nada de lo que se puede calcular debería escribirse a mano: en una planilla
 * oficial cada número copiado es un error en potencia. Aquí viven las columnas
 * calculadas (mejor marca, puesto), los marcadores y los avisos de revisión.
 *
 * Todo son funciones puras sobre (esquema, datos), así que se pueden probar
 * sin navegador.
 */

(function (PL) {
    'use strict';

    /** "12,5" y "12.5" valen lo mismo; el resto es vacío. */
    function parseNum(value) {
        if (typeof value !== 'string' || value.trim() === '') return null;
        var n = parseFloat(value.replace(',', '.'));
        return isFinite(n) ? n : null;
    }

    /** Acepta "12.34", "1:02.5" y "1:02:03" y devuelve segundos. */
    function parseTime(value) {
        if (typeof value !== 'string' || value.trim() === '') return null;
        var parts = value.trim().replace(',', '.').split(':');
        var seconds = 0;

        for (var i = 0; i < parts.length; i++) {
            var n = parseFloat(parts[i]);
            if (!isFinite(n)) return null;
            seconds = seconds * 60 + n;
        }
        return seconds;
    }

    function valueOf(row, key, parse) {
        return parse === 'time' ? parseTime(row[key]) : parseNum(row[key]);
    }

    /**
     * Puestos por ranking. Los empates comparten puesto (1, 2, 2, 4) y quien no
     * tiene marca se queda sin puesto: así una descalificación no corre la lista.
     */
    function rank(rows, column) {
        var spec = column.computed;
        var scored = [];

        rows.forEach(function (row, index) {
            var value = valueOf(row, spec.by, spec.parse);
            if (value !== null) scored.push({ index: index, value: value });
            else row[column.key] = '';
        });

        scored.sort(function (a, b) {
            return spec.order === 'asc' ? a.value - b.value : b.value - a.value;
        });

        var position = 0;
        var previous = null;
        var current = 0;

        scored.forEach(function (entry) {
            position++;
            if (previous === null || entry.value !== previous) current = position;
            previous = entry.value;
            rows[entry.index][column.key] = String(current);
        });
    }

    function max(rows, column) {
        rows.forEach(function (row) {
            var values = column.computed.from
                .map(function (key) { return parseNum(row[key]); })
                .filter(function (n) { return n !== null; });

            row[column.key] = values.length ? String(Math.max.apply(null, values)) : '';
        });
    }

    /** Recalcula, sobre los propios datos, todas las columnas marcadas como computed. */
    function recompute(sport, data) {
        sport.blocks.forEach(function (block) {
            if (block.type !== 'roster') return;
            var rows = data.rosters[block.key];

            block.columns.forEach(function (column) {
                if (!column.computed) return;
                if (column.computed.type === 'max') max(rows, column);
                else if (column.computed.type === 'rank') rank(rows, column);
            });
        });
    }

    /**
     * Marcador de un bloque de periodos.
     *   sum   suma de los valores (goles por tiempo, puntos por cuarto)
     *   score lo que va en el marcador grande; en voleibol NO es la suma de
     *         puntos sino los sets ganados: 25-23 / 25-20 / 22-25 es 2-1.
     */
    function periodScore(block, data) {
        var values = data.periods[block.key];
        var sum = { local: 0, visitante: 0 };

        ['local', 'visitante'].forEach(function (team) {
            values[team].forEach(function (raw) {
                var n = parseNum(raw);
                if (n !== null) sum[team] += n;
            });
        });

        if (block.totalMode !== 'wins') {
            return { sum: sum, score: { local: sum.local, visitante: sum.visitante } };
        }

        var won = { local: 0, visitante: 0 };
        block.labels.forEach(function (_, i) {
            var local = parseNum(values.local[i]);
            var away = parseNum(values.visitante[i]);
            if (local === null || away === null || local === away) return;
            if (local > away) won.local++;
            else won.visitante++;
        });

        return { sum: sum, score: won };
    }

    // ------------------------------------------------------------- revisión

    function issue(level, text) {
        return { level: level, text: text };
    }

    /** El equipo entre paréntesis sólo si tiene nombre: "Plantilla local (Equipo local)" sobra. */
    function rosterLabel(block, data) {
        if (!block.team) return block.title;
        var name = (data.meta[block.team] || '').trim();
        return name ? block.title + ' (' + name + ')' : block.title;
    }

    function checkRoster(block, data, issues, unnamed) {
        var rows = data.rosters[block.key];
        var label = rosterLabel(block, data);
        var hasDni = block.columns.some(function (c) { return c.key === 'dni'; });
        var hasDorsal = block.columns.some(function (c) { return c.key === 'dorsal'; });
        var dorsales = {};
        var named = 0;

        rows.forEach(function (row, i) {
            var line = label + ', fila ' + (i + 1);
            if ((row.nombre || '').trim() !== '') named++;

            if (hasDni && (row.dni || '').trim() !== '' && !/^\d{8}$/.test(row.dni.trim())) {
                issues.push(issue('warn', line + ': el DNI debe tener 8 dígitos.'));
            }

            if (hasDorsal) {
                var dorsal = (row.dorsal || '').trim();
                if (dorsal === '') return;
                if (dorsales[dorsal] !== undefined) {
                    issues.push(issue('error', label + ': dorsal ' + dorsal + ' repetido (filas ' +
                        (dorsales[dorsal] + 1) + ' y ' + (i + 1) + ').'));
                } else {
                    dorsales[dorsal] = i;
                }
            }
        });

        if (named === 0) unnamed.push(label);
    }

    /** Los puntos anotados por jugador deberían cuadrar con la suma de los cuartos. */
    function checkTally(sport, data, issues) {
        var periods = PL.blocksOfType(sport, 'periods')[0];
        if (!periods || periods.totalMode === 'wins') return;

        var totals = periodScore(periods, data);

        sport.blocks.forEach(function (block) {
            if (block.type !== 'roster' || !block.team) return;
            if (!block.columns.some(function (c) { return c.key === 'puntos'; })) return;

            var scored = 0;
            var any = false;
            data.rosters[block.key].forEach(function (row) {
                var n = parseNum(row.puntos);
                if (n !== null) { scored += n; any = true; }
            });

            var expected = totals.sum[block.team];
            if (any && expected > 0 && scored !== expected) {
                issues.push(issue('warn', rosterLabel(block, data) + ': los puntos por jugador suman ' +
                    scored + ' y los cuartos ' + expected + '.'));
            }
        });
    }

    var RANK = { error: 0, warn: 1, info: 2 };

    /**
     * Tres niveles: error (algo está mal), warn (probablemente mal) e info
     * (todavía sin rellenar).
     *
     * Una planilla recién abierta está vacía, no está mal: si cada campo sin
     * rellenar fuese un aviso de color, abrir la aplicación sería encontrarse
     * siete líneas ámbar y el color dejaría de significar nada. Lo pendiente
     * va agrupado en una sola línea neutra y primero se listan los problemas.
     */
    function validate(sport, data) {
        var issues = [];
        var pending = [];
        var unnamed = [];

        sport.meta.forEach(function (field) {
            if ((data.meta[field.key] || '').trim() === '') pending.push(field.label);
        });

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') checkRoster(block, data, issues, unnamed);
        });

        checkTally(sport, data, issues);

        if (pending.length) issues.push(issue('info', 'Pendiente: ' + pending.join(', ') + '.'));
        if (unnamed.length) issues.push(issue('info', 'Sin nombres: ' + unnamed.join(', ') + '.'));

        return issues.sort(function (a, b) { return RANK[a.level] - RANK[b.level]; });
    }

    PL.parseNum = parseNum;
    PL.parseTime = parseTime;
    PL.recompute = recompute;
    PL.periodScore = periodScore;
    PL.validate = validate;
})(window.PL);

/* Estado de la aplicación.
 *
 * Cada deporte guarda VARIAS planillas, no una: en una jornada se arbitran
 * tres series de 100 m y la segunda no debe pisar a la primera.
 *
 *   { config: { institucion, logo },
 *     active: 'futbol',
 *     sports: { futbol: { activeSheet: 'id', sheets: [ {id, name, updatedAt, data} ] } } }
 *
 * Y los datos de una planilla:
 *   { meta: {clave: texto},
 *     rosters: {clave: [ {columna: texto} ]},
 *     periods: {clave: {local: [texto], visitante: [texto]}},
 *     notes: {clave: texto} }
 *
 * Las rutas ("meta.prueba", "rosters.competidores.3.nombre") son las que
 * llevan los inputs en data-path y conectan formulario, hoja y estado.
 */

(function (PL) {
    'use strict';

    var KEY = 'planillas.v3';
    var LEGACY_KEY = 'planillas.v2';

    var config = { institucion: '', logo: '' };
    var sports = {};
    var active = null;
    var saveTimer = null;

    function today() {
        var d = new Date();
        var mm = String(d.getMonth() + 1);
        var dd = String(d.getDate());
        return d.getFullYear() + '-' + (mm.length < 2 ? '0' + mm : mm) + '-' + (dd.length < 2 ? '0' + dd : dd);
    }

    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function emptyRow(block) {
        var row = {};
        block.columns.forEach(function (col) { row[col.key] = ''; });
        return row;
    }

    /** Datos iniciales de una planilla, derivados del esquema del deporte. */
    function blank(sport) {
        var data = { meta: {}, rosters: {}, periods: {}, notes: {} };

        sport.meta.forEach(function (f) {
            if (f.today) data.meta[f.key] = today();
            else if (f.type === 'select') data.meta[f.key] = f.options[0];
            else data.meta[f.key] = '';
        });

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') {
                var rows = [];
                var n = PL.minCount(block);
                for (var i = 0; i < n; i++) rows.push(emptyRow(block));
                data.rosters[block.key] = rows;
            } else if (block.type === 'periods') {
                data.periods[block.key] = {
                    local: block.labels.map(function () { return ''; }),
                    visitante: block.labels.map(function () { return ''; })
                };
            } else if (block.type === 'notes') {
                data.notes[block.key] = '';
            }
        });

        return data;
    }

    /**
     * Mezcla unos datos cualesquiera con los valores por defecto, campo por
     * campo. Es la única puerta de entrada: lo que venga del almacenamiento o
     * de un archivo importado se adapta al esquema en vez de romper la app.
     */
    function hydrate(sport, stored) {
        var data = blank(sport);
        if (!stored || typeof stored !== 'object') return data;

        var storedMeta = stored.meta || {};
        sport.meta.forEach(function (f) {
            if (typeof storedMeta[f.key] === 'string' && storedMeta[f.key] !== '') {
                data.meta[f.key] = storedMeta[f.key];
            }
        });

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') {
                var src = (stored.rosters || {})[block.key];
                if (!Array.isArray(src)) return;
                var rows = src.map(function (raw) {
                    var row = emptyRow(block);
                    if (raw && typeof raw === 'object') {
                        block.columns.forEach(function (col) {
                            if (typeof raw[col.key] === 'string') row[col.key] = raw[col.key];
                        });
                    }
                    return row;
                });
                while (rows.length < PL.minCount(block)) rows.push(emptyRow(block));
                data.rosters[block.key] = rows;
            } else if (block.type === 'periods') {
                var p = (stored.periods || {})[block.key] || {};
                ['local', 'visitante'].forEach(function (team) {
                    if (!Array.isArray(p[team])) return;
                    data.periods[block.key][team] = block.labels.map(function (_, i) {
                        return typeof p[team][i] === 'string' ? p[team][i] : '';
                    });
                });
            } else if (block.type === 'notes') {
                var text = (stored.notes || {})[block.key];
                if (typeof text === 'string') data.notes[block.key] = text;
            }
        });

        return data;
    }

    function makeSheet(sport, name, storedData) {
        return {
            id: uid(),
            name: name,
            updatedAt: new Date().toISOString(),
            data: hydrate(sport, storedData)
        };
    }

    // ------------------------------------------------------------ persistencia

    function readKey(key) {
        try {
            return JSON.parse(localStorage.getItem(key));
        } catch (e) {
            return null; // datos corruptos o almacenamiento bloqueado
        }
    }

    /** La versión anterior guardaba una sola planilla por deporte. */
    function migrateLegacy(old) {
        if (!old || !old.sports) return null;

        var out = { active: old.active, config: {}, sports: {} };
        Object.keys(old.sports).forEach(function (id) {
            out.sports[id] = { sheets: [{ id: uid(), name: 'Planilla 1', data: old.sports[id] }] };
        });
        return out;
    }

    function load() {
        var stored = readKey(KEY) || migrateLegacy(readKey(LEGACY_KEY)) || {};
        var storedConfig = stored.config || {};

        config = {
            institucion: typeof storedConfig.institucion === 'string' ? storedConfig.institucion : '',
            logo: typeof storedConfig.logo === 'string' ? storedConfig.logo : ''
        };

        sports = {};
        PL.sports.forEach(function (sport) {
            var raw = (stored.sports || {})[sport.id] || {};
            var list = Array.isArray(raw.sheets) ? raw.sheets : [];

            var sheets = list.map(function (s, i) {
                s = s || {};
                return {
                    id: typeof s.id === 'string' && s.id ? s.id : uid(),
                    name: typeof s.name === 'string' && s.name ? s.name : 'Planilla ' + (i + 1),
                    updatedAt: typeof s.updatedAt === 'string' ? s.updatedAt : new Date().toISOString(),
                    data: hydrate(sport, s.data)
                };
            });

            if (!sheets.length) sheets.push(makeSheet(sport, 'Planilla 1'));

            var found = sheets.filter(function (s) { return s.id === raw.activeSheet; })[0];
            sports[sport.id] = { activeSheet: found ? found.id : sheets[0].id, sheets: sheets };

            sheets.forEach(function (s) { PL.recompute(sport, s.data); });
        });

        active = PL.sportById(stored.active).id;
    }

    function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            try {
                localStorage.setItem(KEY, JSON.stringify({
                    v: 3, active: active, config: config, sports: sports
                }));
            } catch (e) {
                // Navegación privada o cuota llena: la app sigue funcionando sin guardar.
            }
        }, 250);
    }

    // ------------------------------------------------------------------ acceso

    function getConfig() {
        return config;
    }

    function setConfig(key, value) {
        config[key] = value;
        save();
    }

    function sheets(sportId) {
        return sports[sportId].sheets;
    }

    function sheet(sportId) {
        var entry = sports[sportId];
        var found = entry.sheets.filter(function (s) { return s.id === entry.activeSheet; })[0];
        return found || entry.sheets[0];
    }

    function data(sportId) {
        return sheet(sportId).data;
    }

    function touch(sportId) {
        sheet(sportId).updatedAt = new Date().toISOString();
    }

    function get(sportId, path) {
        var parts = path.split('.');
        var cursor = data(sportId);

        for (var i = 0; i < parts.length; i++) {
            if (cursor === undefined || cursor === null) return '';
            cursor = cursor[parts[i]];
        }
        return cursor === undefined || cursor === null ? '' : cursor;
    }

    /** set('futbol', 'rosters.plantillaLocal.2.nombre', 'Ana') */
    function set(sportId, path, value) {
        var parts = path.split('.');
        var cursor = data(sportId);

        for (var i = 0; i < parts.length - 1; i++) {
            cursor = cursor[parts[i]];
            if (cursor === undefined || cursor === null) return false;
        }

        cursor[parts[parts.length - 1]] = value;
        touch(sportId);
        save();
        return true;
    }

    // ----------------------------------------------------------- planillas

    function selectSheet(sportId, sheetId) {
        var found = sports[sportId].sheets.filter(function (s) { return s.id === sheetId; })[0];
        if (!found) return false;
        sports[sportId].activeSheet = sheetId;
        save();
        return true;
    }

    function createSheet(sportId) {
        var entry = sports[sportId];
        var created = makeSheet(PL.sportById(sportId), 'Planilla ' + (entry.sheets.length + 1));
        entry.sheets.push(created);
        entry.activeSheet = created.id;
        save();
        return created.id;
    }

    function duplicateSheet(sportId) {
        var entry = sports[sportId];
        var source = sheet(sportId);
        var copy = {
            id: uid(),
            name: source.name + ' (copia)',
            updatedAt: new Date().toISOString(),
            data: JSON.parse(JSON.stringify(source.data))
        };

        entry.sheets.push(copy);
        entry.activeSheet = copy.id;
        save();
        return copy.id;
    }

    /** Nunca se queda sin ninguna: borrar la última deja una vacía. */
    function removeSheet(sportId) {
        var entry = sports[sportId];
        var index = entry.sheets.indexOf(sheet(sportId));

        entry.sheets.splice(index, 1);
        if (!entry.sheets.length) entry.sheets.push(makeSheet(PL.sportById(sportId), 'Planilla 1'));

        entry.activeSheet = entry.sheets[Math.min(index, entry.sheets.length - 1)].id;
        save();
        return entry.activeSheet;
    }

    function renameSheet(sportId, name) {
        sheet(sportId).name = name;
        touch(sportId);
        save();
    }

    /** Alta desde un archivo importado: los datos pasan por hydrate. */
    function importSheet(sportId, name, rawData) {
        var entry = sports[sportId];
        var created = makeSheet(PL.sportById(sportId), name, rawData);

        PL.recompute(PL.sportById(sportId), created.data);
        entry.sheets.push(created);
        entry.activeSheet = created.id;
        save();
        return created.id;
    }

    // ---------------------------------------------------------------- filas

    function addRow(sportId, block) {
        var rows = data(sportId).rosters[block.key];
        rows.push(emptyRow(block));
        touch(sportId);
        save();
        return rows.length - 1;
    }

    /** Quita la fila; si ya se está en el mínimo del esquema, sólo la vacía. */
    function removeRow(sportId, block, index) {
        var rows = data(sportId).rosters[block.key];
        if (rows.length > PL.minCount(block)) rows.splice(index, 1);
        else rows[index] = emptyRow(block);
        touch(sportId);
        save();
    }

    /** Reemplaza las filas de una tabla (importación de una plantilla CSV). */
    function setRosterRows(sportId, block, incoming) {
        var rows = incoming.map(function (raw) {
            var row = emptyRow(block);
            block.columns.forEach(function (col) {
                if (typeof raw[col.key] === 'string') row[col.key] = raw[col.key];
            });
            return row;
        });

        while (rows.length < PL.minCount(block)) rows.push(emptyRow(block));

        data(sportId).rosters[block.key] = rows;
        touch(sportId);
        save();
        return rows.length;
    }

    function reset(sportId) {
        sheet(sportId).data = blank(PL.sportById(sportId));
        touch(sportId);
        save();
    }

    function getActive() {
        return active;
    }

    function setActive(sportId) {
        active = sportId;
        save();
    }

    PL.Store = {
        load: load,
        getConfig: getConfig,
        setConfig: setConfig,
        sheets: sheets,
        sheet: sheet,
        data: data,
        get: get,
        set: set,
        selectSheet: selectSheet,
        createSheet: createSheet,
        duplicateSheet: duplicateSheet,
        removeSheet: removeSheet,
        renameSheet: renameSheet,
        importSheet: importSheet,
        addRow: addRow,
        removeRow: removeRow,
        setRosterRows: setRosterRows,
        reset: reset,
        getActive: getActive,
        setActive: setActive
    };
})(window.PL);
    </script>
    <script>
/* Entrada y salida de archivos: JSON para guardar y reabrir, CSV para Excel.
 *
 * Los datos viven en el localStorage de UN navegador. Sin esto, lo que se
 * rellena en el aula no llega a secretaría.
 *
 * La construcción del texto (toCSV, toJSON, fromJSON) es pura y se puede
 * probar sin navegador; sólo download, pickFile y readImage tocan el DOM.
 */

(function (PL) {
    'use strict';

    var SIGNATURE = 'planillas-deportivas';

    // ------------------------------------------------------------------ CSV

    /** Excel en español separa por ";" y necesita el BOM para leer los acentos. */
    function csvCell(value) {
        var text = value === null || value === undefined ? '' : String(value);
        if (/[";\r\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
        return text;
    }

    function csvRow(cells) {
        return cells.map(csvCell).join(';');
    }

    function toCSV(sport, sheet, config) {
        var data = sheet.data;
        var lines = [];

        if (config && config.institucion) lines.push(csvRow(['Institución', config.institucion]));
        lines.push(csvRow(['Planilla', sport.title]));
        lines.push(csvRow(['Nombre', sheet.name]));

        sport.meta.forEach(function (field) {
            lines.push(csvRow([field.label, data.meta[field.key]]));
        });
        lines.push('');

        sport.blocks.forEach(function (block) {
            if (block.type === 'roster') {
                lines.push(csvRow([block.team ? block.title + ' - ' + PL.teamName(data, block.team) : block.title]));
                lines.push(csvRow(['N°'].concat(block.columns.map(function (c) { return c.label; }))));

                data.rosters[block.key].forEach(function (row, i) {
                    lines.push(csvRow([i + 1].concat(block.columns.map(function (c) { return row[c.key]; }))));
                });
            } else if (block.type === 'periods') {
                var score = PL.periodScore(block, data);
                lines.push(csvRow([block.title]));
                lines.push(csvRow(['Equipo'].concat(block.labels, ['Total'])));

                ['local', 'visitante'].forEach(function (team) {
                    lines.push(csvRow([PL.teamName(data, team)]
                        .concat(data.periods[block.key][team], [score.sum[team]])));
                });
                lines.push(csvRow(['Marcador', score.score.local + ' - ' + score.score.visitante]));
            } else if (block.type === 'notes') {
                lines.push(csvRow([block.label]));
                lines.push(csvRow([data.notes[block.key]]));
            }
            lines.push('');
        });

        return '﻿' + lines.join('\r\n');
    }

    // ----------------------------------------------------------------- JSON

    function toJSON(sport, sheet) {
        return JSON.stringify({
            app: SIGNATURE,
            v: 3,
            sport: sport.id,
            name: sheet.name,
            exported: new Date().toISOString(),
            data: sheet.data
        }, null, 2);
    }

    /**
     * Devuelve { sportId, name, data } o lanza un error explicando qué pasa.
     * Los datos crudos NO se usan tal cual: quien llama los pasa por el
     * hidratado del esquema, así que un archivo manipulado no puede meter
     * campos extraños en el estado.
     */
    function fromJSON(text) {
        var parsed;
        try {
            parsed = JSON.parse(text);
        } catch (e) {
            throw new Error('El archivo no es un JSON válido.');
        }

        if (!parsed || parsed.app !== SIGNATURE) {
            throw new Error('El archivo no es una planilla exportada por esta aplicación.');
        }

        var sport = PL.sports.filter(function (s) { return s.id === parsed.sport; })[0];
        if (!sport) throw new Error('La planilla es de un deporte desconocido: ' + parsed.sport + '.');

        return {
            sportId: sport.id,
            name: typeof parsed.name === 'string' && parsed.name ? parsed.name : 'Planilla importada',
            data: parsed.data
        };
    }

    function slug(text) {
        return String(text).toLowerCase()
            .normalize('NFD').replace(/[̀-ͯ]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') || 'planilla';
    }

    // -------------------------------------------------------------- browser

    function download(filename, mime, text) {
        var blob = new Blob([text], { type: mime + ';charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');

        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function pickFile(accept) {
        return new Promise(function (resolve) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = accept;
            input.addEventListener('change', function () {
                resolve(input.files && input.files[0] ? input.files[0] : null);
            });
            input.click();
        });
    }

    function readText(file) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(String(reader.result)); };
            reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
            reader.readAsText(file);
        });
    }

    /** El logo se reescala antes de guardarlo: localStorage tiene unos 5 MB. */
    function readImage(file, maxSize) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();

            reader.onload = function () {
                var image = new Image();
                image.onload = function () {
                    var scale = Math.min(1, maxSize / Math.max(image.width, image.height));
                    var canvas = document.createElement('canvas');
                    canvas.width = Math.round(image.width * scale);
                    canvas.height = Math.round(image.height * scale);
                    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/png'));
                };
                image.onerror = function () { reject(new Error('No se pudo leer la imagen.')); };
                image.src = String(reader.result);
            };

            reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
            reader.readAsDataURL(file);
        });
    }

    // ------------------------------------------ plantilla CSV editable

    /** Normaliza un encabezado para emparejarlo con su columna. */
    function norm(text) {
        return String(text).trim().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    /**
     * Tabla en blanco para rellenar en Excel y volver a cargarla.
     *
     * Sin esto, "Importar" sólo servía para archivos que la propia aplicación
     * hubiera exportado antes: un viaje de ida y vuelta sin ida.
     *
     * Las dos primeras filas dicen a qué deporte y a qué tabla pertenece, para
     * que al importar no haya que adivinarlo ni preguntar.
     */
    function toTemplateCSV(sport, block, data) {
        var title = block.team ? block.title + ' - ' + PL.teamName(data, block.team) : block.title;
        var lines = [
            csvRow(['Planilla', sport.id, sport.title]),
            csvRow(['Tabla', block.key, title]),
            csvRow(block.columns.map(function (c) { return c.label; }))
        ];

        var blank = block.columns.map(function () { return ''; });
        for (var i = 0; i < PL.minCount(block); i++) lines.push(csvRow(blank));

        return '\uFEFF' + lines.join('\r\n');
    }

    /** Parte un CSV separado por ";" respetando las comillas. */
    function parseCSV(text) {
        var rows = [], row = [], cell = '', quoted = false;
        text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');

        for (var i = 0; i < text.length; i++) {
            var ch = text[i];
            if (quoted) {
                if (ch !== '"') cell += ch;
                else if (text[i + 1] === '"') { cell += '"'; i++; }
                else quoted = false;
            } else if (ch === '"') quoted = true;
            else if (ch === ';') { row.push(cell); cell = ''; }
            else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else cell += ch;
        }
        row.push(cell);
        rows.push(row);
        return rows;
    }

    /**
     * Lee una plantilla rellenada: { sportId, rosterKey, rows }, con las filas
     * ya traducidas a las claves de columna del esquema. Los errores explican
     * qué hacer, no sólo qué falló.
     */
    function fromCSV(text) {
        var table = parseCSV(text);
        if (table.length < 4) throw new Error('El archivo está vacío o no tiene forma de plantilla.');

        if (norm(table[0][0]) !== 'planilla' || norm(table[1][0]) !== 'tabla') {
            throw new Error('Al CSV le faltan las dos primeras filas ("Planilla" y "Tabla"). ' +
                'Descarga la plantilla desde la aplicación y rellena esa.');
        }

        var sportId = String(table[0][1] || '').trim();
        var rosterKey = String(table[1][1] || '').trim();

        var sport = PL.sports.filter(function (s) { return s.id === sportId; })[0];
        if (!sport) throw new Error('Deporte desconocido en el archivo: "' + sportId + '".');

        var block = sport.blocks.filter(function (b) {
            return b.type === 'roster' && b.key === rosterKey;
        })[0];
        if (!block) throw new Error('La tabla "' + rosterKey + '" no existe en ' + sport.label + '.');

        var keys = table[2].map(function (header) {
            var match = block.columns.filter(function (c) { return norm(c.label) === norm(header); })[0];
            return match ? match.key : null;
        });
        if (!keys.filter(Boolean).length) {
            throw new Error('Ningún encabezado del CSV coincide con las columnas de "' + block.title +
                '". ¿Se cambió la fila de títulos?');
        }

        var rows = table.slice(3).map(function (cells) {
            var row = {};
            keys.forEach(function (key, i) {
                if (key) row[key] = String(cells[i] === undefined ? '' : cells[i]).trim();
            });
            return row;
        });

        var isBlank = function (row) {
            return Object.keys(row).every(function (k) { return row[k] === ''; });
        };
        while (rows.length && isBlank(rows[rows.length - 1])) rows.pop();

        if (!rows.length) throw new Error('La plantilla no tiene ninguna fila con datos.');

        return { sportId: sportId, rosterKey: rosterKey, rows: rows, blockTitle: block.title };
    }

    PL.io = {
        toCSV: toCSV,
        toTemplateCSV: toTemplateCSV,
        parseCSV: parseCSV,
        fromCSV: fromCSV,
        toJSON: toJSON,
        fromJSON: fromJSON,
        slug: slug,
        download: download,
        pickFile: pickFile,
        readText: readText,
        readImage: readImage
    };
})(window.PL);
    </script>
    <script>
/* Datos de ejemplo.
 *
 * Quien abre la aplicación por primera vez se encuentra un formulario vacío y
 * no entiende qué hace. Un clic en "Ejemplo" carga una planilla realista.
 *
 * Todos los nombres, instituciones y DNI son INVENTADOS. La aplicación maneja
 * datos de menores de edad, así que aquí nunca debe entrar nada real.
 *
 * Los datos pasan por Store.importSheet(), o sea por hydrate(), igual que un
 * archivo importado: no hay una segunda puerta de entrada al estado.
 */

(function (PL) {
    'use strict';

    /** Filas como arrays posicionales: mucho menos ruido que treinta objetos. */
    function rows(keys, table) {
        return table.map(function (values) {
            var row = {};
            keys.forEach(function (key, i) {
                row[key] = values[i] === undefined ? '' : String(values[i]);
            });
            return row;
        });
    }

    var JUGADOR = ['dorsal', 'nombre'];

    var DEMO = {
        salto: {
            meta: { prueba: 'Salto alto', categoria: 'Sub-15', genero: 'Femenino', sede: 'Coliseo Municipal' },
